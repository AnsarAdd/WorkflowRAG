spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  application:
    name: workflowrag

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workflowrag}
    username: ${DB_USERNAME:workflowrag}
    password: ${DB_PASSWORD:workflowrag}

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.yml

workflowrag:
  sources:
    - id: game-files
      type: LOCAL_FILE
      name: Game files
      description: Game design documentation
      update-policy: AUTHORITATIVE_SNAPSHOT
      pipeline-id: default-ingestion
      configuration:
        root: D:/knowledge/game

    - id: java-notes
      type: LOCAL_FILE
      name: Java notes
      description: Java and Spring notes
      update-policy: AUTHORITATIVE_SNAPSHOT
      pipeline-id: default-ingestion
      configuration:
        root: D:/knowledge/java

  chunking:
    max-characters: 2400

  context:
    small-section-max-chars: 4000
    neighbor-distance: 1

  embedding:
    provider: ollama
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${EMBEDDING_MODEL:bge-m3}
    dimensions: 1024
    batch-size: 16
    timeout: 60s

  retrieval:
    default-limit: 5
    max-limit: 50
    min-score: 0.35

  reranking:
    enabled: false
    provider: onnx
    model: bge-reranker-v2-m3
    revision: ""
    model-path: ${RERANKING_MODEL_PATH:}
    tokenizer-path: ${RERANKING_TOKENIZER_PATH:}
    max-length: 1024
    normalize: true
    candidate-multiplier: 4

  source-routing:
    enabled: true
    max-sources: 3
    min-token-length: 3